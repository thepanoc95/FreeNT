[metadata]
name = FreeNT
description = An Free and opensource userland for Windows 11 (with 32-bit support)
version = attr: FreeNT.__version__
author = Panoc95
license = BSD 3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 1 - Planning
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    License :: OSI Approved :: BSD License
    Operating System :: Microsoft :: Windows :: Windows 10
    Operating System :: Microsoft :: Windows :: Windows 11
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: System :: Operating System
    Topic :: System :: Systems Administration
    Topic :: Utilities

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8
install_requires =
    textual>=0.1.0
    textual-web>=0.1.0
    pywin32>=300; sys_platform == 'win32'

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    freent-login = FreeNT.login_manager.login_app:main
    freent-winget = FreeNT.winget_wrapper.winget:main
    freent = FreeNT.cli:main

[options.package_data]
* = *.json, *.yaml, *.yml, *.toml

[options.exclude_package_data]
* = tests/*, */tests/*

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short

[flake8]
max-line-length = 88
extend-exclude = */migrations/*
ignore = E203, W503

[black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[isort]
profile = black
line_length = 88

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
ignore_missing_imports = True
