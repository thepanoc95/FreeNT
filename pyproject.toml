[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FreeNT"
version = "0.1.0"
description = "An Free and opensource userland for Windows 11 (with 32-bit support)"
readme = "README.md"
license = {text = "BSD 3-Clause"}
requires-python = ">=3.8"
authors = [
    {name = "Panoc95", email = ""},
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = ["windows", "userland", "free", "open-source", "login-manager", "winget"]
dependencies = [
    "textual>=0.1.0",
    "textual-web>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "flake8>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]
docs = [
    "docutils>=0.20.0",
    "sphinx>=7.0.0",
]
windows = [
    "pywin32>=300",
]

[project.scripts]
freent-login = "FreeNT.login_manager.login_app:main"
freent-winget = "FreeNT.winget_wrapper.winget:main"
freent = "FreeNT.cli:main"

[project.urls]
Homepage = "https://github.com/thepanoc95/FreeNT"
Documentation = "https://github.com/thepanoc95/FreeNT#readme"
Repository = "https://github.com/thepanoc95/FreeNT.git"
Issues = "https://github.com/thepanoc95/FreeNT/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-exclude = "*/migrations/*"
ignore = "E203, W503"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
